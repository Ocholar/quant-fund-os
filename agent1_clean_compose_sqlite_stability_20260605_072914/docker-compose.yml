services:
  redis:
    image: redis:7
    container_name: quant-fund-os-redis-1
    ports:
      - "6379:6379"
    restart: unless-stopped

  quant:
    build: .
    image: quant-fund-os-quant
    container_name: quant-fund-os-quant-1
    command: ./start.sh
    env_file:
      - .env
    ports:
      - "8080:8080"
    
    environment:
      DB_PATH: /app/data/quant.db
      DATABASE_PATH: /app/data/quant.db
      SQLITE_DB_PATH: /app/data/quant.db
      QFOS_DB_PATH: /app/data/quant.db
      QUANT_DB_PATH: /app/data/quant.db
      DATABASE_URL: sqlite:////app/data/quant.dbvolumes:
      - ./data:/app/data
    depends_on:
      - redis
    restart: unless-stopped

