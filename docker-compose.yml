services:
  redis:
    image: redis:7
    container_name: quant-fund-os-redis-1
    ports:
      - "6379:6379"
    restart: unless-stopped

  quant:
    build: .
    image: quant-fund-os-quant
    container_name: quant-fund-os-quant-1
    command: ./start.sh
    env_file:
      - .env
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
    depends_on:
      - redis
    restart: unless-stopped
