services:
  redis:
    image: redis:7
    container_name: quant-fund-os-redis-1
    ports:
      - "6379:6379"
    restart: unless-stopped

  postgres:
    image: postgres:16
    container_name: quant-fund-os-postgres-1
    environment:
      POSTGRES_DB: quant_fund_os
      POSTGRES_USER: qfos
      POSTGRES_PASSWORD: qfos_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  quant:
    build: .
    image: quant-fund-os-quant
    container_name: quant-fund-os-quant-1
    command: ./start.sh
    env_file:
      - .env
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgresql+psycopg2://qfos:qfos_password@postgres:5432/quant_fund_os
    volumes:
      - ./logs:/app/logs
    depends_on:
      - redis
      - postgres
    restart: unless-stopped

volumes:
  postgres_data:
