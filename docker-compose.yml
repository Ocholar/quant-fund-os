# docker-compose.yml — Oracle Cloud Always Free deployment
# Single container: runs bot + dashboard API together via start.sh

services:
  quant:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - quant_data:/app
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  quant_data:
