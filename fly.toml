app = "quant-fund-os"
primary_region = "jnb"  # Johannesburg - closest to Nairobi

[build]
  dockerfile = "Dockerfile"

[env]
  LIVE_TRADING = "false"
  PYTHONUNBUFFERED = "1"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "30s"
    method = "GET"
    path = "/"

[[mounts]]
  source = "quant_data"
  destination = "/app/data"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
